version: '3.8'

services:
  vision:
    build: .
    image: ${REGISTRY:-docker.io}/photoprism/photoprism-vision:${TAG:-latest}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./models:/app/models
      - ./config:/app/config:rw    # Add persistent config volume
    environment:
      - PYTHONUNBUFFERED=1
      - ENGINE=${ENGINE:-docker}
      - CONFIG_PATH=/app/config    # Add config path
      - SAVE_SETTINGS=true        # Enable settings persistence
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Use different GPU configurations based on engine
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              count: all
              capabilities: [gpu]
    # Allow running as podman or docker
    labels:
      - "io.podman.annotations.backend=${ENGINE:-docker}"
